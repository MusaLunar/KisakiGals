name: kisakigals
description: "KisakiGals - galgame 管理器"
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  flutter_riverpod: ^2.5.1
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  dio: ^5.7.0
  fl_chart: ^0.69.0
  window_manager: ^0.4.3
  flutter_acrylic: ^1.1.4
  cached_network_image: ^3.4.1
  desktop_drop: ^0.4.4
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  tray_manager: ^0.2.3
  archive: ^4.3.0
  crypto: ^3.0.6
  fluent_ui: ^4.17.0
  system_theme: ^3.3.0
  fluentui_system_icons: ^1.1.273
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0
  vm_service: ^14.2.0
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/logo/
  # Adobe Source Han Sans (思源黑体) 简体中文静态子集，
  # 内置以保证跨设备中文字形与字重渲染一致（不依赖系统字体安装）
  fonts:
    - family: SourceHanSansCN
      fonts:
        - asset: assets/fonts/SourceHanSansCN-Regular.otf
          weight: 400
        - asset: assets/fonts/SourceHanSansCN-Medium.otf
          weight: 500
        - asset: assets/fonts/SourceHanSansCN-Bold.otf
          weight: 700
